<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Garmin Git">
  <title>Garmin Git</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Contribution grid: 4x4 cells whose intensity rises to the upper right,
       so the mark reads as "activity trending up" even at 16px, where only the
       brightest cells remain distinguishable. -->
  <g>
    <!-- column 1 -->
    <rect x="10" y="38" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".22"/>
    <rect x="10" y="26" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".16"/>
    <!-- column 2 -->
    <rect x="22" y="38" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".45"/>
    <rect x="22" y="26" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".28"/>
    <!-- column 3 -->
    <rect x="34" y="38" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".72"/>
    <rect x="34" y="26" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".55"/>
    <rect x="34" y="14" width="9" height="9" rx="2.4" fill="#00bbf9" opacity=".3"/>
    <!-- column 4 — the streak -->
    <rect x="46" y="38" width="9" height="9" rx="2.4" fill="#00f5d4"/>
    <rect x="46" y="26" width="9" height="9" rx="2.4" fill="#00f5d4" opacity=".85"/>
    <rect x="46" y="14" width="9" height="9" rx="2.4" fill="#00f5d4" opacity=".6"/>
  </g>

  <!-- Baseline: the "run" the streak sits on -->
  <rect x="10" y="52" width="45" height="3" rx="1.5" fill="#00bbf9" opacity=".35"/>
</svg>
