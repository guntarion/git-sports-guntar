<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Garmin Git">
  <title>Garmin Git</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Four chunky columns climbing left→right. Deliberately few and large:
       an app icon is read at 16px in a tab and at a glance on a home screen,
       where a fine 4x4 grid turns to mush. The step shape survives both. -->
  <g fill="url(#rise)">
    <rect x="86"  y="304" width="72" height="72"  rx="20"/>
    <rect x="182" y="232" width="72" height="144" rx="20"/>
    <rect x="278" y="160" width="72" height="216" rx="20"/>
    <rect x="374" y="88"  width="72" height="288" rx="20"/>
  </g>

  <!-- Faint trailing cells: the "history" the streak was built from -->
  <g fill="#00bbf9" opacity=".18">
    <rect x="86"  y="232" width="72" height="56" rx="18"/>
    <rect x="182" y="160" width="72" height="56" rx="18"/>
    <rect x="278" y="88"  width="72" height="56" rx="18"/>
  </g>

  <!-- Baseline -->
  <rect x="86" y="404" width="360" height="20" rx="10" fill="#00bbf9" opacity=".45"/>
</svg>
