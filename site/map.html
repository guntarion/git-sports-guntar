<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map | Garmin Git</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-title" content="Garmin Git" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Turn your Garmin activities into a GitHub-style dashboard: activity heatmaps, Running Economy, best efforts, sleep and HRV trends, and route maps — updated daily." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{
      --bg:#0f172a;--card:#1e293b;--card2:#243048;--border:#334155;
      --text:#f1f5f9;--muted:#94a3b8;--accent:#00bbf9;
      /* Sport colours — the CVD-validated dark-surface categorical steps. */
      --s-run:#d55181; --s-walk:#3987e5; --s-cycle:#c98500;
      --s-trail:#199e70; --s-hike:#d95926;
      --s-multi:#9085e9; --s-other:#94a3b8;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;overflow:hidden}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;z-index:1200;position:relative}
    .header-title{font-size:15px;font-weight:700}
    .header-nav a{color:var(--muted);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:5px 12px;border-radius:6px;margin-left:6px;transition:.15s;display:inline-block}
    .header-nav a:hover{color:var(--text);border-color:var(--muted)}

    .shell{display:flex;height:calc(100vh - 53px);position:relative}
    #map{flex:1;background:#0b1220}
    .sidebar{width:330px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .28s cubic-bezier(.4,0,.2,1)}
    .sidebar.collapsed{margin-left:-330px}

    .stats{padding:14px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat .s-v{font-size:19px;font-weight:700;line-height:1.1}
    .stat .s-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

    .chips{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap}
    .chip{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px}
    .chip:hover{border-color:var(--muted);color:var(--text)}
    .chip.active{color:#000;font-weight:700;border-color:transparent}
    .chip .dot{width:7px;height:7px;border-radius:50%}

    .panel-tabs{display:flex;border-bottom:1px solid var(--border)}
    .ptab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:11px;padding:9px 0;cursor:pointer;transition:.15s}
    .ptab:hover{color:var(--text)}
    .ptab.active{color:var(--accent);border-bottom-color:var(--accent)}

    .list{flex:1;overflow-y:auto;padding:8px}
    .list::-webkit-scrollbar{width:8px}
    .list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    .place{padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;border:1px solid transparent;display:flex;align-items:center;gap:10px}
    .place:hover{background:var(--card2);border-color:var(--border)}
    .place .p-rank{font-size:10px;color:var(--muted);width:18px;flex:0 0 18px}
    .place .p-body{flex:1;min-width:0}
    .place .p-name{font-size:12px;font-weight:700}
    .place .p-meta{font-size:10px;color:var(--muted);margin-top:2px}
    .place .p-bar{height:3px;background:var(--accent);border-radius:2px;margin-top:5px;opacity:.75}

    .act{padding:9px 11px;border-radius:8px;cursor:pointer;transition:.15s;border-left:3px solid transparent;margin-bottom:3px}
    .act:hover,.act.hot{background:var(--card2);border-left-color:var(--accent)}
    .act .a-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .act .a-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .act .a-dist{font-size:11px;color:var(--muted);flex:0 0 auto}
    .act .a-meta{font-size:9px;color:var(--muted);margin-top:3px;display:flex;gap:7px;align-items:center}
    .act .a-dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}

    .toggle{position:absolute;top:12px;left:12px;z-index:1000;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;width:32px;height:32px;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center}
    .sidebar.collapsed ~ #map .toggle{display:flex}

    .legend{position:absolute;bottom:18px;right:12px;z-index:1000;background:rgba(30,41,59,.94);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:10px;backdrop-filter:blur(6px)}
    .legend div{display:flex;align-items:center;gap:7px;margin-bottom:4px}
    .legend div:last-child{margin-bottom:0}
    .legend .lg-swatch{width:16px;height:3px;border-radius:2px}

    .gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1500;flex-direction:column;gap:10px;text-align:center;padding:24px}
    .gate .g-icon{font-size:30px}
    .gate .g-title{font-size:14px;font-weight:700}
    .gate .g-sub{font-size:11px;color:var(--muted);max-width:400px;line-height:1.6}
    .gate .g-btn{margin-top:6px;background:var(--accent);border:none;color:#000;font-family:inherit;
                 font-size:12px;font-weight:700;padding:9px 22px;border-radius:8px;cursor:pointer;transition:.15s}
    .gate .g-btn:hover{background:#38bdf8}

    .leaflet-container{background:#0b1220}
    .leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border-radius:9px;border:1px solid var(--border);font-family:'JetBrains Mono',monospace}
    .leaflet-popup-tip{background:var(--card);border:1px solid var(--border)}
    .leaflet-popup-content{margin:11px 13px;font-size:11px;line-height:1.6}
    .leaflet-popup-content b{font-size:12px}
    .leaflet-bar a{background:var(--card);color:var(--text);border-color:var(--border)}
    .leaflet-bar a:hover{background:var(--card2)}
    .leaflet-control-attribution{background:rgba(15,23,42,.8)!important;color:var(--muted)!important;font-size:9px}
    .leaflet-control-attribution a{color:var(--muted)!important}

    @media (max-width:760px){
      .sidebar{position:absolute;top:0;bottom:0;left:0;z-index:1100;width:290px}
      .sidebar.collapsed{margin-left:-290px}
      .toggle{display:flex}
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">Map</div>
  <nav class="header-nav">
    <a href="wellness.html">Wellness</a>
    <a href="performance.html">Performance</a>
    <a href="analytics.html">Analytics</a>
    <a href="records.html">Records</a>
    <a href="activities.html">Activities</a>
    <a href="journal.html">Journal</a>
    <a href="./">Dashboard</a>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
    <div class="panel-tabs">
      <button class="ptab active" data-tab="places">Places</button>
      <button class="ptab" data-tab="acts">Sessions</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div id="map">
    <button class="toggle" id="toggle" title="Show panel">☰</button>
  </div>

  <div class="legend" id="legend"></div>
  <div class="gate" id="gate">
    <div class="g-icon">🔒</div>
    <div class="g-title">Private map</div>
    <div class="g-sub">Session locations are only shown to you. Unlock with your access
      password to load routes.</div>
    <!-- Explicit affordance: if the prompt is missed or a load fails, this is
         the way back in rather than a dead end. -->
    <button class="g-btn" id="unlockBtn">Unlock</button>
  </div>
</div>

<script src="storage.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  var API = (window.GS_API_BASE || '/api').replace(/\/$/, '');
  var SPORT = {
    running:       { label: 'Running',  color: 'var(--s-run)',   hex: '#d55181' },
    walking:       { label: 'Walking',  color: 'var(--s-walk)',  hex: '#3987e5' },
    cycling:       { label: 'Cycling',  color: 'var(--s-cycle)', hex: '#c98500' },
    trail_running: { label: 'Trail',    color: 'var(--s-trail)', hex: '#199e70' },
    hiking:        { label: 'Hiking',   color: 'var(--s-hike)',  hex: '#d95926' },
    multi_sport:   { label: 'Multisport', color: 'var(--s-multi)', hex: '#9085e9' },
    other:         { label: 'Other',    color: 'var(--s-other)', hex: '#94a3b8' }
  };
  function sportOf(t) {
    t = (t || '').toLowerCase();
    if (t.indexOf('trail') >= 0) return SPORT.trail_running;
    if (t.indexOf('hik') >= 0) return SPORT.hiking;
    if (t.indexOf('cycl') >= 0 || t.indexOf('bik') >= 0) return SPORT.cycling;
    if (t.indexOf('walk') >= 0) return SPORT.walking;
    if (t.indexOf('multi') >= 0) return SPORT.multi_sport;
    if (t.indexOf('run') >= 0) return SPORT.running;
    // Anything new Garmin invents still gets mapped, just uncoloured — the
    // sync no longer filters by sport, so the UI must not either.
    return SPORT.other;
  }

  var map, layerGroup, state = { data: null, filter: null, tab: 'places', layers: {} };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]);
    });
  }
  function km(m) { return m ? (m / 1000).toFixed(1) : '0'; }

  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: true, preferCanvas: false })
           .setView([-7.35, 112.75], 10);
    // Dark basemap so the routes carry the colour, not the terrain.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
    layerGroup = L.layerGroup().addTo(map);
  }

  function visible() {
    var acts = state.data.activities;
    if (!state.filter) return acts;
    return acts.filter(function (a) { return sportOf(a.type) === state.filter; });
  }

  function draw() {
    layerGroup.clearLayers();
    state.layers = {};
    var acts = visible();
    var bounds = [];

    acts.forEach(function (a) {
      var sp = sportOf(a.type);
      var group = L.layerGroup();

      if (a.route && a.route.length > 1) {
        // Casing underneath + bright line on top reads clearly on a dark map.
        L.polyline(a.route, { color: '#000', weight: 5, opacity: .35, lineJoin: 'round' }).addTo(group);
        var line = L.polyline(a.route, {
          color: sp.hex, weight: 2.5, opacity: .9, lineJoin: 'round', lineCap: 'round'
        }).addTo(group);
        line.on('mouseover', function () { line.setStyle({ weight: 5, opacity: 1 }); });
        line.on('mouseout', function () { line.setStyle({ weight: 2.5, opacity: .9 }); });
        a.route.forEach(function (p) { bounds.push(p); });
      }

      if (a.start) {
        L.circleMarker(a.start, {
          radius: a.route ? 4 : 6, color: '#0b1220', weight: 2,
          fillColor: sp.hex, fillOpacity: .95
        }).addTo(group);
        bounds.push(a.start);
      }

      group.eachLayer(function (l) {
        l.bindPopup(
          '<b>' + esc(a.name || sp.label) + '</b><br>' +
          esc(a.place || '—') + ' · ' + esc(a.date) + '<br>' +
          km(a.distance_m) + ' km · ' + esc(sp.label) +
          (a.route_points ? '' : '<br><i>no GPS route stored</i>')
        );
      });
      group.addTo(layerGroup);
      state.layers[a.id] = group;
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
    renderLegend();
  }

  function renderStats() {
    var d = state.data;
    var acts = visible();
    var dist = acts.reduce(function (s, a) { return s + (a.distance_m || 0); }, 0);
    var dates = acts.map(function (a) { return a.date; }).filter(Boolean).sort();
    var places = {};
    acts.forEach(function (a) { if (a.place) places[a.place] = 1; });
    document.getElementById('stats').innerHTML =
      tile(acts.length, 'sessions') + tile(Object.keys(places).length, 'places') +
      tile(km(dist), 'km total') +
      tile(dates.length ? dates[0].slice(0, 4) + '–' + dates[dates.length - 1].slice(2, 4) : '—', 'span');
    function tile(v, l) {
      return '<div class="stat"><div class="s-v">' + esc(v) + '</div><div class="s-l">' + esc(l) + '</div></div>';
    }
  }

  function renderChips() {
    var counts = {};
    state.data.activities.forEach(function (a) {
      var sp = sportOf(a.type);
      counts[sp.label] = (counts[sp.label] || 0) + 1;
    });
    var html = '<button class="chip' + (state.filter ? '' : ' active') +
      '" data-sport="" style="' + (state.filter ? '' : 'background:var(--accent)') + '">All</button>';
    Object.keys(SPORT).forEach(function (k) {
      var sp = SPORT[k];
      if (!counts[sp.label]) return;
      var on = state.filter === sp;
      html += '<button class="chip' + (on ? ' active' : '') + '" data-sport="' + k + '"' +
        (on ? ' style="background:' + sp.hex + '"' : '') + '>' +
        '<span class="dot" style="background:' + sp.hex + '"></span>' +
        esc(sp.label) + ' ' + counts[sp.label] + '</button>';
    });
    var el = document.getElementById('chips');
    el.innerHTML = html;
    el.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-sport');
        state.filter = k ? SPORT[k] : null;
        renderChips(); renderStats(); renderList(); draw();
      });
    });
  }

  function renderLegend() {
    var used = {};
    visible().forEach(function (a) { used[sportOf(a.type).label] = sportOf(a.type).hex; });
    var keys = Object.keys(used);
    document.getElementById('legend').innerHTML = keys.length
      ? keys.map(function (l) {
          return '<div><span class="lg-swatch" style="background:' + used[l] + '"></span>' + esc(l) + '</div>';
        }).join('')
      : '';
  }

  function renderList() {
    var el = document.getElementById('list');
    if (state.tab === 'places') {
      var acts = visible();
      var byPlace = {};
      acts.forEach(function (a) {
        var p = a.place || 'Unknown';
        byPlace[p] = byPlace[p] || { n: 0, dist: 0, pts: [] };
        byPlace[p].n++;
        byPlace[p].dist += a.distance_m || 0;
        if (a.start) byPlace[p].pts.push(a.start);
      });
      var rows = Object.keys(byPlace).map(function (p) {
        return { place: p, n: byPlace[p].n, dist: byPlace[p].dist, pts: byPlace[p].pts };
      }).sort(function (a, b) { return b.n - a.n; });
      var max = rows.length ? rows[0].n : 1;
      el.innerHTML = rows.map(function (r, i) {
        return '<div class="place" data-place="' + esc(r.place) + '">' +
          '<div class="p-rank">' + (i + 1) + '</div>' +
          '<div class="p-body"><div class="p-name">' + esc(r.place) + '</div>' +
          '<div class="p-meta">' + r.n + ' session' + (r.n === 1 ? '' : 's') + ' · ' + km(r.dist) + ' km</div>' +
          '<div class="p-bar" style="width:' + (r.n / max * 100).toFixed(0) + '%"></div></div></div>';
      }).join('');
      el.querySelectorAll('.place').forEach(function (node) {
        node.addEventListener('click', function () {
          var p = node.getAttribute('data-place');
          var pts = byPlace[p].pts;
          if (pts.length) map.flyToBounds(pts, { padding: [60, 60], maxZoom: 13, duration: .8 });
        });
      });
    } else {
      var list = visible().slice(0, 400);
      el.innerHTML = list.map(function (a) {
        var sp = sportOf(a.type);
        return '<div class="act" data-id="' + esc(a.id) + '">' +
          '<div class="a-top"><div class="a-name">' + esc(a.name || sp.label) + '</div>' +
          '<div class="a-dist">' + km(a.distance_m) + ' km</div></div>' +
          '<div class="a-meta"><span class="a-dot" style="background:' + sp.hex + '"></span>' +
          esc(a.place || '—') + '<span>·</span>' + esc(a.date) +
          (a.route_points ? '' : '<span>· no route</span>') + '</div></div>';
      }).join('');
      el.querySelectorAll('.act').forEach(function (node) {
        var id = node.getAttribute('data-id');
        var act = state.data.activities.find(function (x) { return x.id === id; });
        node.addEventListener('click', function () {
          if (act.route && act.route.length) {
            map.flyToBounds(act.route, { padding: [60, 60], duration: .8 });
          } else if (act.start) {
            map.flyTo(act.start, 15, { duration: .8 });
          }
          var g = state.layers[id];
          if (g) g.eachLayer(function (l) { if (l.openPopup) { l.openPopup(); return false; } });
        });
        node.addEventListener('mouseenter', function () {
          var g = state.layers[id];
          if (g) g.eachLayer(function (l) { if (l.setStyle) l.setStyle({ weight: 6, opacity: 1 }); });
        });
        node.addEventListener('mouseleave', function () {
          var g = state.layers[id];
          if (g) g.eachLayer(function (l) { if (l.setStyle) l.setStyle({ weight: 2.5, opacity: .9 }); });
        });
      });
    }
  }

  document.querySelectorAll('.ptab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.ptab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      state.tab = t.getAttribute('data-tab');
      renderList();
    });
  });
  document.getElementById('toggle').addEventListener('click', function () {
    document.getElementById('sidebar').classList.toggle('collapsed');
    setTimeout(function () { map.invalidateSize(); }, 300);
  });

  function token() { try { return localStorage.getItem('gs_api_token') || ''; } catch (e) { return ''; } }

  // GS.ready() runs the shared login gate, then we load with the stored token.
  var mapReady = false;
  function start() {
    return GS.ready().then(function () {
      document.getElementById('gate').style.display = 'none';
      if (!mapReady) { initMap(); mapReady = true; }
      return fetch(API + '/locations?routes=1', { headers: { Authorization: 'Bearer ' + token() } });
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      state.data = j;
      renderStats(); renderChips(); renderList(); draw();
    }).catch(function (e) {
      var g = document.getElementById('gate');
      g.style.display = 'flex';
      g.querySelector('.g-sub').textContent = 'Could not load the map (' + e.message + '). Try unlocking again.';
    });
  }
  document.getElementById('unlockBtn').addEventListener('click', start);
  start();
}());
</script>
  <script src="nav.js"></script>
</body>
</html>
